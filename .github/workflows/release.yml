# Выпуск версии: запушить тег вида v0.1.1 (или GitHub → Releases → Draft a new release → новый тег → Publish).
# Сценарий сам проставит версию и ссылки в module.json, соберёт module.zip,
# создаст релиз (если его ещё нет) и приложит оба файла. Forge увидит обновление по ссылке на манифест.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проставить версию и ссылки в module.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          REPO="${{ github.repository }}"
          jq --arg v "$VERSION" \
             --arg url "https://github.com/$REPO" \
             --arg manifest "https://github.com/$REPO/releases/latest/download/module.json" \
             --arg download "https://github.com/$REPO/releases/download/$GITHUB_REF_NAME/module.zip" \
             '.version=$v | .url=$url | .manifest=$manifest | .download=$download' \
             module.json > module.tmp && mv module.tmp module.json

      - name: Собрать module.zip
        run: zip -r module.zip module.json scripts README.md CHANGELOG.md

      - name: Описание релиза из CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Версия $VERSION" > notes.md

      - name: Создать релиз и приложить файлы
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" module.json module.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" module.json module.zip --title "$GITHUB_REF_NAME" --notes-file notes.md
          fi
