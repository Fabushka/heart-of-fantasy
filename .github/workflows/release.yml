# Выпуск версии: GitHub → Releases → Draft a new release → тег вида v0.1.1 → Publish.
# Этот сценарий сам проставит версию и ссылки в module.json, соберёт module.zip
# и приложит оба файла к релизу. Forge увидит обновление по ссылке на манифест.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проставить версию и ссылки в module.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          REPO="${{ github.repository }}"
          jq --arg v "$VERSION" \
             --arg url "https://github.com/$REPO" \
             --arg manifest "https://github.com/$REPO/releases/latest/download/module.json" \
             --arg download "https://github.com/$REPO/releases/download/$GITHUB_REF_NAME/module.zip" \
             '.version=$v | .url=$url | .manifest=$manifest | .download=$download' \
             module.json > module.tmp && mv module.tmp module.json

      - name: Собрать module.zip
        run: zip -r module.zip module.json scripts README.md CHANGELOG.md

      - name: Приложить файлы к релизу
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" module.json module.zip --clobber
